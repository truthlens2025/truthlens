<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920, initial-scale=1.0">
<title>TruthLens 功能介绍</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 1080px;
  height: 1920px;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: linear-gradient(180deg, #0a0a18 0%, #1a1a2e 50%, #16213e 100%);
  color: #fff;
  overflow: hidden;
}
.container {
  width: 100%;
  height: 100%;
  padding: 80px 40px 60px;
  display: flex;
  flex-direction: column;
}
.header {
  text-align: center;
  margin-bottom: 60px;
}
.title {
  font-size: 64px;
  font-weight: 700;
  background: linear-gradient(135deg, #00d9ff, #00ff88);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 16px;
}
.subtitle {
  font-size: 28px;
  color: rgba(255,255,255,0.6);
}
.features-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 24px;
  flex: 1;
}
.feature-card {
  background: rgba(255,255,255,0.05);
  border-radius: 32px;
  padding: 36px;
  border: 1px solid rgba(255,255,255,0.1);
}
.feature-icon {
  font-size: 64px;
  margin-bottom: 20px;
}
.feature-title {
  font-size: 30px;
  font-weight: 700;
  margin-bottom: 12px;
}
.feature-desc {
  font-size: 22px;
  color: rgba(255,255,255,0.6);
  line-height: 1.4;
}
.bottom-banner {
  background: linear-gradient(135deg, rgba(0,217,255,0.2), rgba(0,255,136,0.2));
  border-radius: 30px;
  padding: 36px;
  text-align: center;
  margin-top: 40px;
}
.banner-text {
  font-size: 30px;
  font-weight: 600;
  margin-bottom: 16px;
}
.banner-highlight {
  color: #00ff88;
}
.download-btn {
  display: inline-block;
  background: linear-gradient(135deg, #00d9ff, #00ff88);
  color: #0a0a18;
  font-size: 28px;
  font-weight: 700;
  padding: 20px 60px;
  border-radius: 30px;
}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="title">核心功能</div>
    <div class="subtitle">TruthLens 真视镜</div>
  </div>
  
  <div class="features-grid">
    <div class="feature-card">
      <div class="feature-icon">📝</div>
      <div class="feature-title">文本检测</div>
      <div class="feature-desc">精准识别文章、论文、简历是否由AI生成</div>
    </div>
    <div class="feature-card">
      <div class="feature-icon">🖼️</div>
      <div class="feature-title">图片识别</div>
      <div class="feature-desc">辨别Midjourney、Stable Diffusion等AI绘图</div>
    </div>
    <div class="feature-card">
      <div class="feature-icon">📄</div>
      <div class="feature-title">文档分析</div>
      <div class="feature-desc">支持PDF、Word文档批量检测</div>
    </div>
    <div class="feature-card">
      <div class="feature-icon">📊</div>
      <div class="feature-title">详细报告</div>
      <div class="feature-desc">多维度分析，AI概率可视化呈现</div>
    </div>
  </div>
  
  <div class="bottom-banner">
    <div class="banner-text">
      🔍 准确率高达 <span class="banner-highlight">98.6%</span>
    </div>
    <div class="download-btn">免费下载体验</div>
  </div>
</div>
</body>
</html>
