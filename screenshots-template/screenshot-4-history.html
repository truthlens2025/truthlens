<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920, initial-scale=1.0">
<title>TruthLens 历史记录</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 1080px;
  height: 1920px;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #0f0f23;
  color: #fff;
  overflow: hidden;
}
.container {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  padding: 60px 40px;
}
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 40px;
}
.title {
  font-size: 40px;
  font-weight: 700;
}
.header-actions {
  display: flex;
  gap: 16px;
}
.icon-btn {
  width: 80px;
  height: 80px;
  background: rgba(255,255,255,0.1);
  border-radius: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 36px;
}
.filter-tabs {
  display: flex;
  gap: 16px;
  margin-bottom: 30px;
}
.filter-tab {
  padding: 16px 32px;
  background: rgba(255,255,255,0.1);
  border-radius: 20px;
  font-size: 26px;
}
.filter-tab.active {
  background: #00d9ff;
  color: #0f0f23;
}
.history-list {
  flex: 1;
  overflow-y: auto;
}
.history-item {
  background: rgba(255,255,255,0.05);
  border-radius: 28px;
  padding: 30px;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  gap: 24px;
}
.item-icon {
  width: 100px;
  height: 100px;
  background: rgba(0,217,255,0.2);
  border-radius: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 48px;
}
.item-content {
  flex: 1;
}
.item-type {
  font-size: 28px;
  font-weight: 600;
  margin-bottom: 8px;
}
.item-preview {
  font-size: 22px;
  color: rgba(255,255,255,0.5);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.item-time {
  font-size: 20px;
  color: rgba(255,255,255,0.4);
  margin-top: 6px;
}
.item-result {
  text-align: right;
}
.result-badge {
  padding: 12px 24px;
  border-radius: 16px;
  font-size: 22px;
  font-weight: 600;
}
.badge-ai { background: rgba(255,107,107,0.2); color: #ff6b6b; }
.badge-human { background: rgba(0,255,136,0.2); color: #00ff88; }
.badge-mixed { background: rgba(255,217,61,0.2); color: #ffd93d; }
.bottom-nav {
  display: flex;
  gap: 20px;
  margin-top: 30px;
  padding-top: 30px;
  border-top: 1px solid rgba(255,255,255,0.1);
}
.nav-item {
  flex: 1;
  text-align: center;
  padding: 16px;
}
.nav-icon { font-size: 48px; margin-bottom: 8px; }
.nav-text { font-size: 22px; color: rgba(255,255,255,0.5); }
.nav-item.active { color: #00d9ff; }
.nav-item.active .nav-text { color: #00d9ff; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="title">📋 检测记录</div>
    <div class="header-actions">
      <div class="icon-btn">🔍</div>
      <div class="icon-btn">🗑️</div>
    </div>
  </div>
  
  <div class="filter-tabs">
    <div class="filter-tab active">全部</div>
    <div class="filter-tab">文本</div>
    <div class="filter-tab">图片</div>
    <div class="filter-tab">文档</div>
  </div>
  
  <div class="history-list">
    <div class="history-item">
      <div class="item-icon">📝</div>
      <div class="item-content">
        <div class="item-type">文本检测</div>
        <div class="item-preview">人工智能技术在医疗领域的应用前景...</div>
        <div class="item-time">今天 14:30</div>
      </div>
      <div class="item-result">
        <div class="result-badge badge-human">人类 87%</div>
      </div>
    </div>
    
    <div class="history-item">
      <div class="item-icon">🖼️</div>
      <div class="item-content">
        <div class="item-type">图片检测</div>
        <div class="item-preview">landscape_mountain.jpg</div>
        <div class="item-time">今天 11:20</div>
      </div>
      <div class="item-result">
        <div class="result-badge badge-ai">AI生成 92%</div>
      </div>
    </div>
    
    <div class="history-item">
      <div class="item-icon">📄</div>
      <div class="item-content">
        <div class="item-type">文档检测</div>
        <div class="item-preview">thesis_draft.pdf</div>
        <div class="item-time">昨天 18:45</div>
      </div>
      <div class="item-result">
        <div class="result-badge badge-mixed">混合 45%</div>
      </div>
    </div>
  </div>
  
  <div class="bottom-nav">
    <div class="nav-item">🏠<div class="nav-text">首页</div></div>
    <div class="nav-item">📊<div class="nav-text">记录</div></div>
    <div class="nav-item active">📋<div class="nav-text">历史</div></div>
    <div class="nav-item">⚙️<div class="nav-text">设置</div></div>
  </div>
</div>
</body>
</html>
