<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920, initial-scale=1.0">
<title>TruthLens 检测结果</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 1080px;
  height: 1920px;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: linear-gradient(180deg, #0f0f23 0%, #1a1a2e 100%);
  color: #fff;
  overflow: hidden;
}
.container {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  padding: 60px 40px;
}
.header {
  display: flex;
  align-items: center;
  margin-bottom: 40px;
}
.back-btn {
  width: 80px;
  height: 80px;
  background: rgba(255,255,255,0.1);
  border-radius: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 40px;
  margin-right: 20px;
}
.title {
  font-size: 36px;
  font-weight: 600;
}
.result-card {
  background: linear-gradient(135deg, rgba(0,217,255,0.2), rgba(0,255,136,0.2));
  border: 2px solid rgba(0,255,136,0.5);
  border-radius: 40px;
  padding: 50px 40px;
  margin-bottom: 40px;
  text-align: center;
}
.result-icon {
  font-size: 120px;
  margin-bottom: 20px;
}
.result-label {
  font-size: 32px;
  color: rgba(255,255,255,0.7);
  margin-bottom: 10px;
}
.result-score {
  font-size: 96px;
  font-weight: 700;
  color: #00ff88;
  margin-bottom: 20px;
}
.result-tag {
  display: inline-block;
  background: #00ff88;
  color: #0f0f23;
  font-size: 28px;
  font-weight: 700;
  padding: 12px 40px;
  border-radius: 30px;
}
.content-section {
  background: rgba(255,255,255,0.05);
  border-radius: 30px;
  padding: 30px;
  margin-bottom: 30px;
}
.section-title {
  font-size: 28px;
  font-weight: 600;
  margin-bottom: 20px;
  color: #00d9ff;
}
.analysis-item {
  display: flex;
  align-items: center;
  padding: 16px 0;
  border-bottom: 1px solid rgba(255,255,255,0.1);
}
.analysis-item:last-child { border-bottom: none; }
.item-label {
  flex: 1;
  font-size: 26px;
  color: rgba(255,255,255,0.8);
}
.item-value {
  font-size: 28px;
  font-weight: 600;
}
.item-value.high { color: #ff6b6b; }
.item-value.medium { color: #ffd93d; }
.item-value.low { color: #00ff88; }
.chart-area {
  background: rgba(255,255,255,0.05);
  border-radius: 30px;
  padding: 30px;
  margin-bottom: 30px;
}
.bar-chart {
  display: flex;
  align-items: flex-end;
  gap: 20px;
  height: 200px;
  margin-top: 20px;
}
.bar {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.bar-fill {
  width: 100%;
  border-radius: 10px 10px 0 0;
  transition: height 0.5s;
}
.bar-label {
  font-size: 20px;
  margin-top: 10px;
  color: rgba(255,255,255,0.7);
}
.footer-actions {
  display: flex;
  gap: 20px;
  margin-top: auto;
}
.action-btn {
  flex: 1;
  background: linear-gradient(135deg, #00d9ff, #00ff88);
  border: none;
  border-radius: 30px;
  padding: 30px;
  font-size: 30px;
  font-weight: 600;
  color: #0f0f23;
  cursor: pointer;
}
.share-btn {
  background: rgba(255,255,255,0.1);
  color: #fff;
}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="back-btn">←</div>
    <div class="title">检测结果</div>
  </div>
  
  <div class="result-card">
    <div class="result-icon">✅</div>
    <div class="result-label">AI生成概率</div>
    <div class="result-score">12.3%</div>
    <div class="result-tag">⚡ 极低风险 · 原创内容</div>
  </div>
  
  <div class="content-section">
    <div class="section-title">📊 多维度分析</div>
    <div class="analysis-item">
      <span class="item-label">词汇丰富度</span>
      <span class="item-value low">正常</span>
    </div>
    <div class="analysis-item">
      <span class="item-label">句式复杂度</span>
      <span class="item-value low">正常</span>
    </div>
    <div class="analysis-item">
      <span class="item-label">语义连贯性</span>
      <span class="item-value low">正常</span>
    </div>
    <div class="analysis-item">
      <span class="item-label">逻辑结构</span>
      <span class="item-value low">正常</span>
    </div>
  </div>
  
  <div class="chart-area">
    <div class="section-title">📈 概率分布</div>
    <div class="bar-chart">
      <div class="bar">
        <div class="bar-fill" style="height:20%; background:#00ff88;"></div>
        <div class="bar-label">AI</div>
      </div>
      <div class="bar">
        <div class="bar-fill" style="height:80%; background:#00d9ff;"></div>
        <div class="bar-label">人类</div>
      </div>
    </div>
  </div>
  
  <div class="footer-actions">
    <button class="action-btn">📤 导出报告</button>
    <button class="action-btn share-btn">📤 分享</button>
  </div>
</div>
</body>
</html>
