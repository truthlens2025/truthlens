<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920, initial-scale=1.0, maximum-scale=1.0">
<title>TruthLens 首页</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 1080px;
  height: 1920px;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
  color: #fff;
  overflow: hidden;
}
.container {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  padding: 60px 40px;
}
.header {
  text-align: center;
  margin-bottom: 50px;
}
.logo {
  width: 160px;
  height: 160px;
  background: linear-gradient(135deg, #00d9ff, #00ff88);
  border-radius: 40px;
  margin: 0 auto 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 80px;
  box-shadow: 0 20px 60px rgba(0, 217, 255, 0.3);
}
.app-name {
  font-size: 56px;
  font-weight: 700;
  background: linear-gradient(135deg, #00d9ff, #00ff88);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 12px;
}
.tagline {
  font-size: 28px;
  color: rgba(255,255,255,0.7);
}
.search-box {
  background: rgba(255,255,255,0.1);
  border-radius: 30px;
  padding: 30px 40px;
  margin-bottom: 50px;
  display: flex;
  align-items: center;
  gap: 20px;
}
.search-icon {
  font-size: 48px;
  color: #00d9ff;
}
.search-input {
  flex: 1;
  background: transparent;
  border: none;
  color: #fff;
  font-size: 32px;
  outline: none;
}
.search-input::placeholder {
  color: rgba(255,255,255,0.5);
}
.tabs {
  display: flex;
  gap: 20px;
  margin-bottom: 40px;
}
.tab {
  flex: 1;
  background: rgba(255,255,255,0.1);
  border-radius: 20px;
  padding: 30px;
  text-align: center;
  transition: all 0.3s;
}
.tab.active {
  background: linear-gradient(135deg, #00d9ff, #00ff88);
  box-shadow: 0 10px 40px rgba(0, 217, 255, 0.3);
}
.tab-icon {
  font-size: 56px;
  margin-bottom: 10px;
}
.tab-text {
  font-size: 24px;
  font-weight: 600;
}
.quick-actions {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
  margin-bottom: 50px;
}
.action {
  background: rgba(255,255,255,0.1);
  border-radius: 24px;
  padding: 30px 20px;
  text-align: center;
}
.action-icon {
  font-size: 48px;
  margin-bottom: 12px;
}
.action-text {
  font-size: 22px;
  color: rgba(255,255,255,0.9);
}
.tip {
  background: rgba(0, 217, 255, 0.1);
  border: 1px solid rgba(0, 217, 255, 0.3);
  border-radius: 24px;
  padding: 30px;
  text-align: center;
}
.tip-text {
  font-size: 26px;
  color: #00d9ff;
}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="logo">🔍</div>
    <div class="app-name">TruthLens</div>
    <div class="tagline">AI内容鉴定 · 一眼辨真假</div>
  </div>
  
  <div class="search-box">
    <span class="search-icon">🔍</span>
    <input type="text" class="search-input" placeholder="输入文本或上传图片检测..." disabled>
  </div>
  
  <div class="tabs">
    <div class="tab active">
      <div class="tab-icon">📝</div>
      <div class="tab-text">文本检测</div>
    </div>
    <div class="tab">
      <div class="tab-icon">🖼️</div>
      <div class="tab-text">图片检测</div>
    </div>
    <div class="tab">
      <div class="tab-icon">📄</div>
      <div class="tab-text">文档检测</div>
    </div>
  </div>
  
  <div class="quick-actions">
    <div class="action">
      <div class="action-icon">📋</div>
      <div class="action-text">粘贴文本</div>
    </div>
    <div class="action">
      <div class="action-icon">📷</div>
      <div class="action-text">拍照上传</div>
    </div>
    <div class="action">
      <div class="action-icon">📁</div>
      <div class="action-text">文件上传</div>
    </div>
  </div>
  
  <div class="tip">
    <div class="tip-text">✨ 多模型联合分析 · 准确率高达98.6%</div>
  </div>
</div>
</body>
</html>
