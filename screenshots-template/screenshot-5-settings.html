<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920, initial-scale=1.0">
<title>TruthLens 设置</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 1080px;
  height: 1920px;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #0f0f23;
  color: #fff;
  overflow: hidden;
}
.container {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  padding: 60px 40px;
}
.header {
  display: flex;
  align-items: center;
  margin-bottom: 50px;
}
.back-btn {
  width: 80px;
  height: 80px;
  background: rgba(255,255,255,0.1);
  border-radius: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 40px;
  margin-right: 20px;
}
.title {
  font-size: 40px;
  font-weight: 700;
}
.profile-section {
  background: linear-gradient(135deg, rgba(0,217,255,0.1), rgba(0,255,136,0.1));
  border-radius: 36px;
  padding: 40px;
  margin-bottom: 40px;
  display: flex;
  align-items: center;
  gap: 30px;
}
.avatar {
  width: 140px;
  height: 140px;
  background: linear-gradient(135deg, #00d9ff, #00ff88);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 72px;
}
.profile-info {
  flex: 1;
}
.profile-name {
  font-size: 36px;
  font-weight: 700;
  margin-bottom: 10px;
}
.profile-status {
  font-size: 24px;
  color: #00ff88;
}
.settings-group {
  background: rgba(255,255,255,0.05);
  border-radius: 30px;
  overflow: hidden;
  margin-bottom: 30px;
}
.settings-item {
  display: flex;
  align-items: center;
  padding: 32px;
  border-bottom: 1px solid rgba(255,255,255,0.1);
}
.settings-item:last-child { border-bottom: none; }
.item-icon {
  font-size: 40px;
  margin-right: 24px;
}
.item-label {
  flex: 1;
  font-size: 28px;
}
.item-value {
  font-size: 26px;
  color: rgba(255,255,255,0.5);
  margin-right: 12px;
}
.item-arrow {
  font-size: 32px;
  color: rgba(255,255,255,0.3);
}
.toggle {
  width: 100px;
  height: 56px;
  background: #00d9ff;
  border-radius: 28px;
  position: relative;
}
.toggle::after {
  content: '';
  position: absolute;
  width: 48px;
  height: 48px;
  background: #fff;
  border-radius: 50%;
  top: 4px;
  right: 4px;
}
.about-section {
  background: rgba(255,255,255,0.05);
  border-radius: 30px;
  padding: 30px;
  text-align: center;
}
.about-text {
  font-size: 24px;
  color: rgba(255,255,255,0.5);
  margin-bottom: 16px;
}
.version {
  font-size: 22px;
  color: rgba(255,255,255,0.3);
}
.bottom-nav {
  display: flex;
  gap: 20px;
  margin-top: auto;
  padding-top: 30px;
}
.nav-item {
  flex: 1;
  text-align: center;
  padding: 16px;
}
.nav-icon { font-size: 48px; margin-bottom: 8px; }
.nav-text { font-size: 22px; color: rgba(255,255,255,0.5); }
.nav-item.active { color: #00d9ff; }
.nav-item.active .nav-text { color: #00d9ff; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="back-btn">←</div>
    <div class="title">设置</div>
  </div>
  
  <div class="profile-section">
    <div class="avatar">👤</div>
    <div class="profile-info">
      <div class="profile-name">钟顺英</div>
      <div class="profile-status">✓ 已认证用户</div>
    </div>
  </div>
  
  <div class="settings-group">
    <div class="settings-item">
      <span class="item-icon">🌓</span>
      <span class="item-label">深色模式</span>
      <div class="toggle"></div>
    </div>
    <div class="settings-item">
      <span class="item-icon">🔔</span>
      <span class="item-label">消息通知</span>
      <span class="item-value">已开启</span>
      <span class="item-arrow">›</span>
    </div>
    <div class="settings-item">
      <span class="item-icon">🌐</span>
      <span class="item-label">语言</span>
      <span class="item-value">简体中文</span>
      <span class="item-arrow">›</span>
    </div>
  </div>
  
  <div class="settings-group">
    <div class="settings-item">
      <span class="item-icon">📤</span>
      <span class="item-label">导出历史记录</span>
      <span class="item-arrow">›</span>
    </div>
    <div class="settings-item">
      <span class="item-icon">🗑️</span>
      <span class="item-label">清除缓存</span>
      <span class="item-value">32.5 MB</span>
      <span class="item-arrow">›</span>
    </div>
    <div class="settings-item">
      <span class="item-icon">🔒</span>
      <span class="item-label">隐私政策</span>
      <span class="item-arrow">›</span>
    </div>
    <div class="settings-item">
      <span class="item-icon">📝</span>
      <span class="item-label">用户协议</span>
      <span class="item-arrow">›</span>
    </div>
  </div>
  
  <div class="about-section">
    <div class="about-text">TruthLens 真视镜 v1.0.0</div>
    <div class="version">© 2026 All Rights Reserved</div>
  </div>
  
  <div class="bottom-nav">
    <div class="nav-item">🏠<div class="nav-text">首页</div></div>
    <div class="nav-item">📊<div class="nav-text">记录</div></div>
    <div class="nav-item">📋<div class="nav-text">历史</div></div>
    <div class="nav-item active">⚙️<div class="nav-text">设置</div></div>
  </div>
</div>
</body>
</html>
