<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920, initial-scale=1">
<title>TruthLens Screenshot 1 - Home</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 1080px;
  height: 1920px;
  background: #0a0a0f;
  font-family: -apple-system, 'PingFang SC', sans-serif;
  overflow: hidden;
  color: #f0f0f8;
}
.nav {
  display: flex; justify-content: space-between; align-items: center;
  padding: 30px 50px;
  border-bottom: 1px solid rgba(255,255,255,0.06);
}
.logo { display: flex; align-items: center; gap: 16px; }
.logo-icon {
  width: 68px; height: 68px; background: #7c6aff; border-radius: 18px;
  display: flex; align-items: center; justify-content: center;
  font-size: 32px;
}
.logo-text { font-size: 36px; font-weight: 800; letter-spacing: -1px; }
.lang-toggle {
  display: flex; background: #1a1a26; border-radius: 14px; padding: 6px;
}
.lang-btn { padding: 10px 28px; border-radius: 10px; font-size: 28px; color: #6b6b8a; }
.lang-btn.active { background: #7c6aff; color: white; }

.hero { text-align: center; padding: 80px 50px 60px; }
.badge {
  display: inline-flex; align-items: center; gap: 12px;
  background: rgba(124,106,255,0.15);
  border: 1px solid rgba(124,106,255,0.3);
  border-radius: 100px; padding: 12px 28px; margin-bottom: 36px;
}
.badge-dot { width: 12px; height: 12px; border-radius: 50%; background: #7c6aff; }
.badge-text { font-size: 26px; color: #a89fff; letter-spacing: 2px; text-transform: uppercase; }
.title { font-size: 80px; font-weight: 800; margin-bottom: 20px; letter-spacing: -2px; line-height: 1.1; }
.subtitle { font-size: 32px; color: #6b6b8a; font-weight: 300; }

.card {
  background: #12121a;
  border: 1px solid rgba(255,255,255,0.07);
  border-radius: 44px;
  margin: 0 40px 30px;
  overflow: hidden;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
}
.tabs {
  display: flex;
  border-bottom: 1px solid rgba(255,255,255,0.07);
  padding: 0 40px;
}
.tab {
  flex: 1; display: flex; align-items: center; justify-content: center; gap: 14px;
  padding: 28px 0; border-bottom: 4px solid transparent; margin-bottom: -1px;
}
.tab.active { border-bottom-color: #7c6aff; }
.tab-icon { font-size: 36px; }
.tab-text { font-size: 30px; color: #6b6b8a; }
.tab.active .tab-text { color: #f0f0f8; }

.input-area { padding: 40px; }
.text-input {
  background: #1a1a26; border: 1px solid rgba(255,255,255,0.07);
  border-radius: 28px; padding: 30px; color: #f0f0f8; font-size: 30px;
  min-height: 300px; width: 100%; text-align: left; line-height: 1.6;
}
.placeholder { color: #6b6b8a; }

.actions { display: flex; justify-content: space-between; align-items: center; margin-top: 28px; gap: 20px; }
.options { display: flex; gap: 14px; flex-wrap: wrap; }
.chip {
  display: flex; align-items: center; gap: 10px;
  padding: 14px 24px;
  background: #1a1a26; border: 1px solid rgba(255,255,255,0.07); border-radius: 14px;
}
.chip.selected { background: rgba(124,106,255,0.15); border-color: rgba(124,106,255,0.4); }
.chip-icon { font-size: 26px; }
.chip-text { font-size: 26px; color: #6b6b8a; }
.chip.selected .chip-text { color: #a89fff; }

.detect-btn {
  background: #7c6aff; border-radius: 22px;
  padding: 22px 52px; font-size: 32px; font-weight: 500; color: white;
  white-space: nowrap;
}

.stats {
  display: flex; margin: 0 40px 30px; gap: 20px;
}
.stat {
  flex: 1; background: #12121a; border: 1px solid rgba(255,255,255,0.07);
  border-radius: 28px; padding: 30px 20px; text-align: center;
}
.stat-num { font-size: 38px; font-weight: 800; color: #7c6aff; margin-bottom: 8px; }
.stat-label { font-size: 22px; color: #6b6b8a; }

.features { padding: 0 40px 60px; }
.section-title { font-size: 38px; font-weight: 700; text-align: center; margin-bottom: 28px; }
.feature {
  display: flex; gap: 28px;
  background: #12121a; border: 1px solid rgba(255,255,255,0.07);
  border-radius: 28px; padding: 34px; margin-bottom: 18px;
}
.feature-icon { font-size: 52px; margin-top: 4px; }
.feature-name { font-size: 30px; font-weight: 600; margin-bottom: 10px; }
.feature-desc { font-size: 26px; color: #6b6b8a; line-height: 1.6; }
</style>
</head>
<body>

<div class="nav">
  <div class="logo">
    <div class="logo-icon">🔍</div>
    <span class="logo-text">TruthLens</span>
  </div>
  <div class="lang-toggle">
    <div class="lang-btn">EN</div>
    <div class="lang-btn active">中文</div>
  </div>
</div>

<div class="hero">
  <div class="badge">
    <div class="badge-dot"></div>
    <span class="badge-text">AI 内容检测工具</span>
  </div>
  <div class="title">一眼看穿<br>AI 生成</div>
  <div class="subtitle">秒速检测文本、图片是否由 AI 生成。</div>
</div>

<div class="card">
  <div class="tabs">
    <div class="tab active">
      <span class="tab-icon">📝</span>
      <span class="tab-text">文本</span>
    </div>
    <div class="tab">
      <span class="tab-icon">🖼️</span>
      <span class="tab-text">图片</span>
    </div>
    <div class="tab">
      <span class="tab-icon">📄</span>
      <span class="tab-text">文档</span>
    </div>
  </div>
  <div class="input-area">
    <div class="text-input" style="display:flex; align-items:center; justify-content:center;">
      <span class="placeholder">粘贴文本内容...</span>
    </div>
    <div class="actions">
      <div class="options">
        <div class="chip selected">
          <span class="chip-icon">🔬</span>
          <span class="chip-text">深度扫描</span>
        </div>
        <div class="chip">
          <span class="chip-icon">✨</span>
          <span class="chip-text">高亮标注</span>
        </div>
      </div>
      <div class="detect-btn">🔍 开始检测</div>
    </div>
  </div>
</div>

<div class="stats">
  <div class="stat">
    <div class="stat-num">98.6%</div>
    <div class="stat-label">准确率</div>
  </div>
  <div class="stat">
    <div class="stat-num">2.4M+</div>
    <div class="stat-label">已检测</div>
  </div>
  <div class="stat">
    <div class="stat-num">GPT-4o</div>
    <div class="stat-label">支持</div>
  </div>
</div>

<div class="features">
  <div class="section-title">我们能检测什么</div>
  <div class="feature">
    <span class="feature-icon">📝</span>
    <div>
      <div class="feature-name">文本检测</div>
      <div class="feature-desc">检测文章、论文、社交媒体内容是否由 AI 生成。</div>
    </div>
  </div>
  <div class="feature">
    <span class="feature-icon">🖼️</span>
    <div>
      <div class="feature-name">图片识别</div>
      <div class="feature-desc">识别 Midjourney、DALL-E 等 AI 绘图。</div>
    </div>
  </div>
</div>

</body>
</html>
